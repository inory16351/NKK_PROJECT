<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아지트 햄스터 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6ecd9; --ink:#5b3a22; --card:#fffaf0; --line:#e3cfae; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Jua', sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:18px 16px 40px; }
  h1 { font-size:26px; margin:4px 0 6px; }
  p { margin:4px 0 10px; line-height:1.5; font-size:16px; }
  .card { background:var(--card); border:3px solid var(--line); border-radius:18px; padding:14px; margin-top:14px; }
  canvas { width:100%; display:block; border-radius:12px; border:3px solid #8a5a3c; cursor:pointer; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { font-family:inherit; font-size:16px; color:var(--ink); background:#fbefd6; border:3px solid #8a5a3c; border-radius:12px; padding:6px 14px; cursor:pointer; }
  button.on { background:#f7c948; }
  .note { font-size:14px; opacity:.8; }
</style>
</head>
<body>
<main>
  <h1>아지트 햄스터 미리보기</h1>
  <p>평소엔 무표정으로 숨 쉬며 가끔 눈을 깜빡여요. <b>햄스터를 누르면</b> 활짝 웃으며 따봉! 을 하고, 잠시 뒤 다시 무표정으로 돌아와요. (아직 게임에는 넣지 않았어요)</p>
  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <button data-z="1" class="on">아지트 크기</button>
      <button data-z="2.6">크게 보기</button>
    </div>
    <canvas id="cv"></canvas>
    <p class="note">그림은 Codex 로 그린 파츠를 붙여 움직이기만 해요 (새로 그린 효과 없음). 실제 게임에서 크기 · 위치는 바뀔 수 있어요.</p>
  </div>
</main>
<script>
const IMG = __IMGS__;
const PIV = __PIV__;
const RIG = __RIG__;
const BG = '__BG__';
const im = {}; let left = Object.keys(IMG).length + 1;
const ready = () => { if (--left === 0) start(); };
for (const k in IMG) { const i = new Image(); i.onload = ready; i.src = IMG[k]; im[k] = i; }
const bgI = new Image(); bgI.onload = ready; bgI.src = BG;

const cv = document.getElementById('cv'), g = cv.getContext('2d');
let zoom = 1, clickAt = -99, now = 0;
const HAM_H = 150;                       // 아지트 1536 폭 배경에서 햄스터 키 (px)
const SPOT = [0.47, 0.655];              // 책상 위 자리 (배경 비율)
const ACT = 2.2;                         // 따봉 전체 시간 (초)

function put(name, x, y, ang, k = 1, flip = false) {
  const i = im[name]; if (!i) return; const [px, py] = PIV[name];
  g.save(); g.translate(x, y); g.rotate(-ang * Math.PI / 180); g.scale(flip ? -k : k, k);
  g.drawImage(i, -px * i.width, -py * i.height); g.restore();
}
function att(name, cx, cy, ang, a) {    // 몸 그림 위 부착점 → 화면 좌표 (몸 중심 cx, cy · 기울기 ang)
  const i = im[name], [px, py] = PIV[name];
  const vx = (a[0] - px) * i.width, vy = (a[1] - py) * i.height, r = ang * Math.PI / 180;
  return [cx + vx * Math.cos(r) + vy * Math.sin(r), cy - vx * Math.sin(r) + vy * Math.cos(r)];
}
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const back = t => { t = Math.min(1, Math.max(0, t)); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function hamster(t, ta) {   // t = 시간, ta = 누른 뒤 경과 (따봉 중이 아니면 음수/큰 값)
  const act = ta >= 0 && ta < ACT;
  const breathe = Math.sin(t * 2 * Math.PI * 0.6);
  let squash = 0, hop = 0, thumb = 0, happy = false;
  if (act) {
    squash = ta < 0.12 ? ease(ta / 0.12) : ta < 0.3 ? 1 - ease((ta - 0.12) / 0.18) : 0;      // 움찔
    hop = ta > 0.12 && ta < 0.55 ? Math.sin((ta - 0.12) / 0.43 * Math.PI) * 34 : 0;         // 폴짝
    thumb = ta < 0.15 ? 0 : ta < ACT - 0.35 ? back((ta - 0.15) / 0.3) : 1 - ease((ta - (ACT - 0.35)) / 0.3);
    happy = ta > 0.1 && ta < ACT - 0.2;
  }
  const cx = 0, cy = -hop;
  const sy = 1 - 0.1 * squash + 0.012 * breathe, sx = 1 + 0.08 * squash;
  const aBody = act ? 0 : 2.5 * Math.sin(t * 2 * Math.PI * 0.35);
  g.save(); g.scale(sx, sy);
  const neck = att('body', cx, cy, aBody, RIG.neck);
  put('tail', ...att('body', cx, cy, aBody, RIG.tail), aBody + 8 * Math.sin(t * 2 * Math.PI * 1.5));
  put('foot', ...att('body', cx, cy, aBody, RIG.footL), -6, RIG.footK);
  put('foot', ...att('body', cx, cy, aBody, RIG.footR), 6, RIG.footK, true);
  put('body', cx, cy, aBody);
  const wig = 4 * Math.sin(t * 2 * Math.PI * 1.2);
  // 화면 왼쪽 팔 = 평소 그대로 (배 앞)
  put('arm_l', ...att('body', cx, cy, aBody, RIG.shL), aBody + RIG.armAngL - wig, RIG.armK);
  // 화면 오른쪽 팔: 평소 팔 ↔ 따봉 팔 (어깨에서 들어 올림)
  const shR = att('body', cx, cy, aBody, RIG.shR);
  if (thumb > 0.05) {
    const a = RIG.thumbAng0 + (RIG.thumbAng1 - RIG.thumbAng0) * thumb + (thumb > 0.9 ? 4 * Math.sin(ta * 2 * Math.PI * 3) : 0);
    put('thumb', shR[0] + RIG.thumbOff[0], shR[1] + RIG.thumbOff[1], aBody + a, RIG.thumbK);
  } else put('arm', ...shR, aBody + RIG.armAngR + wig, RIG.armK);
  // 머리: 평소 무표정 (가끔 깜빡) · 따봉 중 활짝 웃음
  const blink = !act && (t % 3.7) > 3.55;
  const head = happy ? 'head_happy' : blink ? 'head_blink' : 'head';
  const tilt = act ? 6 * thumb : 3 * Math.sin(t * 2 * Math.PI * 0.5);
  put(head, neck[0], neck[1] + 1.5 * breathe, aBody * 1.4 + tilt, RIG.headK);
  g.restore();
}

function start() {
  const resize = () => { const w = cv.clientWidth, dpr = devicePixelRatio || 1; cv.width = w * dpr; cv.height = w * 0.62 * dpr; cv.style.height = w * 0.62 + 'px'; };
  resize(); addEventListener('resize', resize);
  document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { zoom = +b.dataset.z; document.querySelectorAll('[data-z]').forEach(x => x.classList.toggle('on', x === b)); });
  let hit = null;
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
    if (hit && x > hit[0] && x < hit[2] && y > hit[1] && y < hit[3] && !(now - clickAt < ACT)) clickAt = now;
  });
  let last = performance.now();
  (function loop(ts) {
    now += (ts - last) / 1000; last = ts;
    const W = cv.width, H = cv.height;
    // 배경: 햄스터 자리를 가운데로, zoom 배
    const s = W / bgI.width * zoom * 1.25;
    const fx = SPOT[0] * bgI.width, fy = SPOT[1] * bgI.height;
    g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#2b2622'; g.fillRect(0, 0, W, H);
    g.setTransform(s, 0, 0, s, W / 2 - fx * s, H * 0.72 - fy * s); g.drawImage(bgI, 0, 0);
    // 햄스터: 몸 중심 기준 → 바닥(발끝)이 책상 위
    const k = HAM_H / RIG.height;
    g.translate(fx, fy); g.scale(k, k); g.translate(0, -RIG.footToCenter);
    hamster(now, now - clickAt);
    const m = g.getTransform();
    const p0 = m.transformPoint(new DOMPoint(-RIG.width / 2, -(RIG.height - RIG.footToCenter))), p1 = m.transformPoint(new DOMPoint(RIG.width / 2, RIG.footToCenter));
    hit = [p0.x, p0.y, p1.x, p1.y];
    requestAnimationFrame(loop);
  })(last);
}
</script>
</body>
</html>
